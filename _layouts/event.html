---
layout: default
nav: gallery
---
<section class="page-hero">
  <div class="wrap">
    <div class="breadcrumb"><a href="{{ '/index.html' | relative_url }}">خانه</a> / <a href="{{ '/گالری.html' | relative_url }}">گالری</a></div>
    <h1>{{ page.title }}</h1>
    <p><span style="direction:ltr;unicode-bidi:isolate;display:inline-block;">{{ page.date | date: "%d %B %Y" }}</span>{% if page.description %} — {{ page.description }}{% endif %}</p>
  </div>
</section>

<section class="gallery-full">
  <div class="wrap">
    <div class="gallery-grid uniform-grid">
      {% for photo in page.photos %}
      <a class="g-item" href="{{ photo | relative_url }}" data-lightbox="{{ photo | relative_url }}" data-lightbox-alt="{{ page.title }}">
        <picture>
          <source srcset="{{ photo | replace: '.jpeg', '.webp' | relative_url }}" type="image/webp">
          <img src="{{ photo | relative_url }}" alt="{{ page.title }}" loading="lazy">
        </picture>
      </a>
      {% endfor %}
    </div>
  </div>
</section>
