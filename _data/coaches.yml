- name: مجتبی توسلی
  role: سرمربی
  photo: ""
  bio: با نزدیک به ده سال سابقه دویدن و مربیگری، مجتبی هم در ایران و هم در آلمان با دوندگان مبتدی تا حرفه‌ای کار کرده. مدرک مربیگری از آکادمی‌های دوومیدانی ایران و آلمان داره و تجربه گسترده‌ای در دویدن‌های جاده، تریل و اولترامارتن داره — از مسابقات ۵ کیلومتر گرفته تا اولترامارتن‌های بلندمسافت.
  credentials:
    - مدرک مربیگری از آکادمی‌های دوومیدانی ایران و آلمان
    - تجربه ده‌ساله دویدن رقابتی، از ۵ کیلومتر تا اولترامارتن و مسابقات تریل
    - تخصص در برنامه‌ریزی دوره‌ای (periodization) و بازگشت اصولی از آسیب
    - ساکن مانهایم — کلاس‌های حضوری و آنلاین
