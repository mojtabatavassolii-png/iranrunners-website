body: >-
  ایران رانرز مجموعه‌ای تخصصی در حوزه تمرین و پیشرفت دوومیدانی است که از ۶ سال
  پیش با هدف همراهی ورزشکاران در مسیر رشد و دستیابی به اهداف ورزشی‌شان فعالیت
  خود را آغاز کرده است. در این سال‌ها بیش از ۵۰۰ نفر از علاقه‌مندان به دویدن به
  جمع اعضای این مجموعه پیوسته‌اند و بخشی از مسیر پیشرفت خود را با ما طی
  کرده‌اند.


  ما باور داریم هر ورزشکار داستان و نیازهای منحصربه‌فرد خودش را دارد؛ به همین
  دلیل تلاش می‌کنیم فضایی منظم، صمیمی و انگیزه‌بخش فراهم کنیم که در آن هر عضو
  بتواند بهترین توان خود را به عملکرد واقعی تبدیل کند. تکیه‌ی ما بر برنامه‌ریزی
  مشخص و راهنمایی‌های تخصصی است؛ رویکردی که در طول این سال‌ها به تجربه‌ای پایدار
  و نتایج ملموس برای اعضای تیم تبدیل شده است.


  تیم ایران رانرز با ترکیبی از تمرین حضوری و غیرحضوری، امکان دسترسی به
  برنامه‌های تمرینی حرفه‌ای را برای علاقه‌مندان به دویدن فراهم کرده است؛ چه در
  ایران و چه در میان ایرانیان مقیم خارج از کشور. برنامه‌های تمرینی متناسب با سطح
  هر ورزشکار طراحی می‌شوند و به‌صورت هفتگی در اختیار او قرار می‌گیرند، همراه با
  امکان مشاوره و تحلیل تخصصی عملکرد.


  هدف ما فقط پیشرفت فیزیکی نیست؛ ما به دنبال ساختن مجموعه‌ای هستیم که با تکیه بر
  تجربه‌ی چندین‌ساله‌ی خود، تجربه‌ای موثر، الهام‌بخش و سرشار از حس رشد را برای
  اعضایش رقم بزند.
