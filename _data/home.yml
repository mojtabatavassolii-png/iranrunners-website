about_section:
  title: "ایران رانرز؛ تیمی برای کسانی که دویدن را جدی می‌گیرند"
  paragraphs:
    - "ایران رانرز یک تیم و جامعه‌ی دویدن است که از دوندگان تازه‌کار تا حرفه‌ای را کنار هم جمع می‌کند. ما باور داریم دویدن فقط یک ورزش نیست؛ مسیری است برای رسیدن به هدف‌هایی که شاید روزی دور به نظر می‌رسیدند، از اولین ۵ کیلومتر تا خط پایان یک ماراتن. هر قدم، یک مسیر تازه به سوی هدف است."
    - "در کلاس‌های ایران رانرز، زیر نظر مربیان تیم، برنامه‌ی تمرینی متناسب با سطح و هدف خودتان می‌گیرید. چه می‌خواهید دویدن را از صفر شروع کنید، چه برای ۱۰ کیلومتر، نیم‌ماراتن یا ماراتن آماده شوید، تمرین گروهی و راهنمایی مربی کمک می‌کند اصولی بدوید، انگیزه‌تان را نگه دارید و از آسیب دور بمانید. می‌توانید با مربیان تیم آشنا شوید و کلاس مناسب خودتان را انتخاب کنید."
    - "علاوه بر کلاس‌ها، در وبلاگ ایران رانرز مقاله‌های آموزشی درباره‌ی تمرین، تغذیه، پیشگیری از آسیب و آمادگی برای مسابقه می‌خوانید. ابزار محاسبه‌ی پیس هم به شما نشان می‌دهد برای رسیدن به زمان هدفتان در هر کیلومتر با چه سرعتی بدوید. و اگر دوست دارید در فضای واقعی مسابقه تجربه کسب کنید، در گالری سایت لحظه‌هایی از مسابقه‌های تیمی، از جمله ده کیلومتر تهران کلاب، را ببینید و به جمع ما بپیوندید."
