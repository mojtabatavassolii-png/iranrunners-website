hero_lead: پیس، زمان و فاصله رو به هم تبدیل کن، یا زمان یه مسابقه رو وارد کن تا پیش‌بینی زمانت توی فاصله‌های دیگه رو ببینی.
convert_heading: تبدیل پیس، زمان و فاصله
convert_description: می‌خوای بدونی با یه فاصله و زمان مشخص پیست چقدره؟ یا با یه پیس مشخص، فلان فاصله رو تو چقدر زمان می‌دوی؟ این ابزار برای همینه — هر دوتا از این سه مقدار رو بدی، سومی رو خودش حساب می‌کنه.
predict_heading: پیش‌بینی زمان مسابقه
predict_description: یه مسابقه دویدی و می‌خوای بدونی توی فاصله‌های دیگه (از ۵ کیلومتر تا ماراتن) چه زمانی می‌تونی بزنی؟ زمان یکی از فاصله‌ها رو بده، بر اساس فرمول علمی Riegel پیش‌بینی زمانت توی بقیه فاصله‌ها رو ببین.
