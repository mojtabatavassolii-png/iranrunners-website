hero_lead: پیس، زمان و فاصله رو به هم تبدیل کن، یا زمان یه مسابقه رو وارد کن تا
  پیش‌بینی زمانت توی فاصله‌های دیگه رو ببینی.
convert_heading: تبدیل پیس، زمان و فاصله
convert_description: می‌خوای بدونی با یه مسافت و زمان مشخص پیست چقدره؟ یا با یک
  پیس مشخص، مسافت مورد نظرت رو تو چقدر زمان می‌دوی؟ این ابزار برای همینه — هر
  دوتا از این سه مقدار رو بزنی، سومی رو خودش حساب می‌کنه.
predict_heading: پیش‌بینی زمان مسابقه
