name: Generate SEO report

on:
  workflow_dispatch: {}
  schedule:
    # 19:30 UTC = 23:00 Iran Standard Time (UTC+3:30, no DST since 2022) — end of day.
    - cron: "30 19 * * *"

permissions:
  contents: write

jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-save google-auth-library js-yaml

      - name: Generate report
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
          GA4_PROPERTY_ID: "555311601"
          SITE_URL: "https://iranrunners.com"
        run: node scripts/generate_seo_report.js

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/ assets/data/dashboard-latest.json
          if git diff --cached --quiet; then
            echo "No report changes."
            exit 0
          fi
          git commit -m "Update SEO report and dashboard data $(date +%Y-%m-%d)"
          git push

      - name: Upload report as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: seo-report
          path: |
            reports/report-*.md
            assets/data/dashboard-latest.json
