name: Generate SEO report

on:
  workflow_dispatch: {}
  schedule:
    # Runs 4x/day (roughly every 6h) instead of once, since GitHub's cron
    # scheduler can delay a single daily slot by hours under load (observed
    # drift: the old once-daily 19:30 UTC slot actually fired anywhere from
    # 21:30 to 23:30 UTC). With four slots a day, the dashboard's
    # generatedAt timestamp stays within a few hours of "now" even if one
    # slot is delayed or skipped. Minutes are offset from :00 per GitHub's
    # own advice to avoid the top-of-hour high-load window.
    # Note: the underlying Search Console / GA4 data itself still always
    # lags ~2-3 days behind "today" - that's a Google processing limit, not
    # something a tighter schedule can fix (see SEO_REPORTING.md).
    - cron: "12 1,7,13,19 * * *"

permissions:
  contents: write

jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-save google-auth-library js-yaml

      - name: Generate report
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
          GA4_PROPERTY_ID: "555311601"
          SITE_URL: "https://iranrunners.com"
        run: node scripts/generate_seo_report.js

      - name: TEMP diagnostic - marathon query check
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
          SITE_URL: "https://iranrunners.com"
        run: node scripts/_diag_query_check.js

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/ assets/data/dashboard-latest.json
          if git diff --cached --quiet; then
            echo "No report changes."
            exit 0
          fi
          git commit -m "Update SEO report and dashboard data $(date +%Y-%m-%d)"
          git push

      - name: Upload report as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: seo-report
          path: |
            reports/report-*.md
            assets/data/dashboard-latest.json
