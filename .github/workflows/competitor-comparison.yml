name: Fetch competitor comparison data

# Manual only (not scheduled): this fetches third-party sites, so it should
# run deliberately, not automatically every few hours like the SEO report.
# Run it from the Actions tab's "Run workflow" button, or by asking Claude
# to run it.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch-competitor-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-save js-yaml

      - name: Fetch competitor data
        env:
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
        run: node scripts/fetch_competitor_data.js

      - name: Commit raw data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/competitor-raw-*.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Fetch competitor comparison raw data $(date +%Y-%m-%d)"
          git push

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: competitor-raw-data
          path: reports/competitor-raw-*.json
