title: "ایران رانرز"
description: "تیم ورزشی ایران رانرز"
lang: fa

# اگه دامین اختصاصی iranrunners.com رو وصل کردید (Custom domain در تنظیمات Pages)،
# این خط رو به baseurl: "" تغییر بدید. تا وقتی سایت روی
# mojtabatavassolii-png.github.io/iranrunners-website هست، همین مقدار درسته.
baseurl: ""
url: "https://iranrunners.com"

google_analytics_id: "G-V1RD1YG8S0"
crisp_website_id: "3cf78bb8-e295-4f4a-98f8-f1a4c031b606"

markdown: kramdown
permalink: /وبلاگ/:title.html

# سایت فقط موقع push جدید build می‌شه (نه به‌صورت زمان‌بندی‌شده)، پس اگه این
# false بمونه، مقاله یا رویدادی که تاریخش امروز نیست (مثلاً یه روز جلوتره)
# ساخته نمی‌شه و ۴۰۴ می‌ده و تا push بعدی همینطور می‌مونه.
future: true

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from

collections:
  posts:
    output: true
  classes:
    output: true
  events:
    output: true

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "classes"
    values:
      layout: "class"
      permalink: "/کلاس-ها/:title.html"
  - scope:
      path: ""
      type: "events"
    values:
      layout: "event"
      permalink: "/گالری/:title.html"


exclude:
  - README.md
  - "*.py"

kramdown:
  input: GFM
