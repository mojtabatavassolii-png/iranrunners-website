<footer class="site-footer">
  <div class="wrap">
    <div class="footer-row">
      <div class="footer-brand-group">
        <a href="{{ '/index.html' | relative_url }}" class="brand">
          <img src="{{ '/assets/logo.jpeg' | relative_url }}" alt="ایران رانرز" style="height:64px;width:auto;border-radius:6px;">
        </a>
        {% if site.data.about.contact.instagram %}
        <a href="https://instagram.com/{{ site.data.about.contact.instagram | remove: '@' }}" class="footer-social" target="_blank" rel="noopener">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="5"/>
            <circle cx="12" cy="12" r="4"/>
            <circle cx="17.2" cy="6.8" r="0.7" fill="currentColor" stroke="none"/>
          </svg>
          <span class="mono">Iran runners instagram</span>
        </a>
        {% endif %}
      </div>
      <nav class="footer-nav">
        <a href="{{ '/index.html' | relative_url }}">خانه</a>
        <a href="{{ '/classes.html' | relative_url }}">کلاس‌ها</a>
        <a href="{{ '/blog.html' | relative_url }}">وبلاگ</a>
        <a href="{{ '/gallery.html' | relative_url }}">گالری</a>
        <a href="{{ '/about.html' | relative_url }}">درباره ما</a>
      </nav>
    </div>
    <div class="footer-copy">© 2026 IRAN RUNNERS — MANNHEIM, GERMANY</div>
  </div>
</footer>
