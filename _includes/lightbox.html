<div class="lightbox-overlay" id="lightbox-overlay" hidden>
  <button type="button" class="lightbox-close" id="lightbox-close" aria-label="بستن">&times;</button>
  <div class="lightbox-stage">
    <button type="button" class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="عکس قبلی">&#8249;</button>
    <img class="lightbox-img" id="lightbox-img" src="" alt="">
    <button type="button" class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="عکس بعدی">&#8250;</button>
  </div>
  <a class="lightbox-download" id="lightbox-download" href="" download>دانلود عکس</a>
</div>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var overlay = document.getElementById('lightbox-overlay');
    var imgEl = document.getElementById('lightbox-img');
    var downloadLink = document.getElementById('lightbox-download');
    var closeBtn = document.getElementById('lightbox-close');
    var prevBtn = document.getElementById('lightbox-prev');
    var nextBtn = document.getElementById('lightbox-next');
    if (!overlay || !imgEl || !downloadLink || !closeBtn || !prevBtn || !nextBtn) { return; }

    var items = [];
    var currentIndex = -1;

    function showAt(index) {
      if (items.length === 0) { return; }
      currentIndex = (index + items.length) % items.length;
      var trigger = items[currentIndex];
      imgEl.src = trigger.getAttribute('data-lightbox');
      imgEl.alt = trigger.getAttribute('data-lightbox-alt') || '';
      downloadLink.href = trigger.getAttribute('data-lightbox');
      var showNav = items.length > 1;
      prevBtn.hidden = !showNav;
      nextBtn.hidden = !showNav;
    }
    function openLightbox(trigger) {
      items = Array.prototype.slice.call(document.querySelectorAll('[data-lightbox]'));
      showAt(items.indexOf(trigger));
      overlay.hidden = false;
      document.body.style.overflow = 'hidden';
    }
    function closeLightbox() {
      overlay.hidden = true;
      imgEl.src = '';
      items = [];
      currentIndex = -1;
      document.body.style.overflow = '';
    }

    document.addEventListener('click', function (e) {
      var trigger = e.target.closest('[data-lightbox]');
      if (trigger) {
        e.preventDefault();
        openLightbox(trigger);
        return;
      }
      if (overlay.hidden) { return; }
      if (e.target === nextBtn) { showAt(currentIndex + 1); return; }
      if (e.target === prevBtn) { showAt(currentIndex - 1); return; }
      if (e.target === overlay || e.target === closeBtn) { closeLightbox(); }
    });
    document.addEventListener('keydown', function (e) {
      if (overlay.hidden) { return; }
      if (e.key === 'Escape') { closeLightbox(); }
      else if (e.key === 'ArrowRight') { showAt(currentIndex + 1); }
      else if (e.key === 'ArrowLeft') { showAt(currentIndex - 1); }
    });
  });
</script>
