<div class="lightbox-overlay" id="lightbox-overlay" hidden>
  <button type="button" class="lightbox-close" id="lightbox-close" aria-label="بستن">&times;</button>
  <img class="lightbox-img" id="lightbox-img" src="" alt="">
  <a class="lightbox-download" id="lightbox-download" href="" download>دانلود عکس</a>
</div>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var overlay = document.getElementById('lightbox-overlay');
    var imgEl = document.getElementById('lightbox-img');
    var downloadLink = document.getElementById('lightbox-download');
    var closeBtn = document.getElementById('lightbox-close');
    if (!overlay || !imgEl || !downloadLink || !closeBtn) { return; }

    function openLightbox(url, alt) {
      imgEl.src = url;
      imgEl.alt = alt || '';
      downloadLink.href = url;
      overlay.hidden = false;
      document.body.style.overflow = 'hidden';
    }
    function closeLightbox() {
      overlay.hidden = true;
      imgEl.src = '';
      document.body.style.overflow = '';
    }

    document.addEventListener('click', function (e) {
      var trigger = e.target.closest('[data-lightbox]');
      if (trigger) {
        e.preventDefault();
        openLightbox(trigger.getAttribute('data-lightbox'), trigger.getAttribute('data-lightbox-alt'));
        return;
      }
      if (!overlay.hidden && (e.target === overlay || e.target === closeBtn)) {
        closeLightbox();
      }
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !overlay.hidden) { closeLightbox(); }
    });
  });
</script>
