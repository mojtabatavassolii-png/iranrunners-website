media:
  - name: gallery
    label: "عکس‌های گالری"
    input: assets/gallery
    output: /assets/gallery
    categories: [image]

  - name: coaches
    label: "عکس‌های مربیان"
    input: assets/coaches
    output: /assets/coaches
    categories: [image]

  - name: partners
    label: "لوگوی شرکا"
    input: assets/partners
    output: /assets/partners
    categories: [image]

  - name: blog
    label: "عکس‌های وبلاگ"
    input: assets/blog
    output: /assets/blog
    categories: [image]

content:
  - name: posts
    label: "مقالات وبلاگ"
    type: collection
    path: _posts
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      primary: title
      sort: date
      order: desc
    fields:
      - name: title
        label: "عنوان"
        type: string
        required: true

      - name: description
        label: "توضیح متا (برای گوگل، حدود ۱۵۰ کاراکتر)"
        type: text
        required: true

      - name: category
        label: "دسته‌بندی"
        type: select
        options:
          values:
            - "علم دویدن"
            - "تغذیه"
            - "پیشگیری از آسیب"
            - "برنامه تمرینی"
            - "تجهیزات"
            - "سلامت"
        required: true

      - name: icon
        label: "آیکون تصویر مقاله (اگه عکس واقعی نذاری، از این آیکون استفاده می‌شه)"
        type: select
        options:
          values:
            - beginner
            - nutrition
            - knee
            - chart
            - marathon
            - shoe
            - recovery
            - air
        required: true

      - name: image
        label: "عکس مقاله (اختیاری — اگه نذاری، آیکون بالا نمایش داده می‌شه)"
        type: image
        media: blog

      - name: read_time
        label: "زمان مطالعه (مثلاً 6 MIN READ)"
        type: string

      - name: date
        label: "تاریخ انتشار"
        type: date
        required: true

      - name: lead
        label: "پاراگراف مقدمه (زیر تیتر اصلی)"
        type: text
        required: true

      - name: cta_title
        label: "عنوان دعوت به اقدام (پایین مقاله)"
        type: string

      - name: cta_text
        label: "متن دعوت به اقدام"
        type: text

      - name: body
        label: "متن مقاله (از ## برای زیرعنوان‌ها استفاده کن)"
        type: rich-text

  - name: classes
    label: "کلاس‌ها"
    type: collection
    path: _classes
    filename: "{primary}.md"
    view:
      primary: title
      sort: order
      order: asc
    fields:
      - name: title
        label: "عنوان کلاس"
        type: string
        required: true

      - name: level_tag
        label: "برچسب سطح (انگلیسی کوتاه، مثل BEGINNER)"
        type: string
        required: true

      - name: order
        label: "ترتیب نمایش (عدد کوچیک‌تر = بالاتر)"
        type: number
        required: true

      - name: description
        label: "توضیح کوتاه (روی کارت نشون داده می‌شه)"
        type: text
        required: true

      - name: schedule
        label: "زمان‌بندی جلسات"
        type: string

      - name: price
        label: "قیمت ماهانه (یورو)"
        type: number
        required: true

      - name: price_toman
        label: "قیمت ماهانه (تومان — با کاما بنویس، مثلاً 2,500,000)"
        type: string

      - name: body
        label: "توضیحات کامل (این متن توی صفحه جزئیات کلاس نشون داده می‌شه)"
        type: rich-text

  - name: gallery_photos
    label: "عکس‌های گالری"
    type: file
    path: _data/gallery.yml
    list: true
    fields:
      - name: file
        label: "عکس"
        type: image
        media: gallery
        required: true

      - name: alt
        label: "توضیح عکس (برای دسترسی‌پذیری و سئو)"
        type: string
        required: true

      - name: tag
        label: "برچسب روی عکس (انگلیسی کوتاه)"
        type: string

      - name: size
        label: "اندازه در چیدمان گالری"
        type: select
        options:
          values:
            - name: normal
              label: "معمولی"
            - name: wide
              label: "پهن (دو ستون)"
            - name: tall
              label: "بلند (دو ردیف)"
            - name: wide-tall
              label: "پهن و بلند"

      - name: rotation
        label: "چرخش عکس"
        type: select
        options:
          values:
            - name: "0"
              label: "بدون چرخش"
            - name: "90"
              label: "۹۰ درجه (راست‌گرد)"
            - name: "180"
              label: "۱۸۰ درجه (وارونه)"
            - name: "270"
              label: "۲۷۰ درجه (چپ‌گرد)"
              
  - name: hero_text
    label: "متن زیر عنوان اصلی صفحه اول"
    type: file
    path: _data/hero_text.yml
    fields:
      - name: lead
        label: "متن (خالی بذار تا کامل حذف بشه)"
        type: text

  - name: hero_photos
    label: "هدر سایت (اسلایدشو صفحه اصلی)"
    type: file
    path: _data/hero.yml
    list: true
    fields:
      - name: file
        label: "عکس (اندازه استاندارد: حداقل 1600×900 پیکسل، افقی)"
        type: image
        media: gallery
        required: true

  - name: coaches
    label: "مربیان"
    type: file
    path: _data/coaches.yml
    list: true
    fields:
      - name: name
        label: "نام و نام‌خانوادگی"
        type: string
        required: true

      - name: role
        label: "سمت (مثلاً سرمربی)"
        type: string

      - name: photo
        label: "عکس مربی (اندازه استاندارد: حداقل 800×1000 پیکسل، عمودی)"
        type: image
        media: coaches

      - name: bio
        label: "بیوگرافی"
        type: text
        required: true

      - name: credentials
        label: "مدارک و سوابق (هر خط یک مورد)"
        type: string
        list: true

      - name: pr_5k
        label: "رکورد ۵ کیلومتر (اختیاری)"
        type: string

      - name: pr_half
        label: "رکورد نیم‌ماراتن (اختیاری)"
        type: string

      - name: pr_marathon
        label: "رکورد ماراتن (اختیاری)"
        type: string

  - name: partners
    label: "شرکای ما"
    type: file
    path: _data/partners.yml
    list: true
    fields:
      - name: name
        label: "نام شرکت"
        type: string
        required: true

      - name: logo
        label: "لوگو (اندازه استاندارد: حداکثر ۴۰۰×۱۶۰ پیکسل، پس‌زمینه شفاف PNG بهتره)"
        type: image
        media: partners

      - name: link
        label: "لینک سایت شرکت (اختیاری)"
        type: string
