media:
  - name: gallery
    label: "عکس‌های گالری"
    input: assets/gallery
    output: /assets/gallery
    categories: [image]

  - name: coaches
    label: "عکس‌های مربیان"
    input: assets/coaches
    output: /assets/coaches
    categories: [image]

  - name: partners
    label: "لوگوی شرکا"
    input: assets/partners
    output: /assets/partners
    categories: [image]

  - name: blog
    label: "عکس‌های وبلاگ"
    input: assets/blog
    output: /assets/blog
    categories: [image]

  - name: events
    label: "عکس‌های رویدادها"
    input: assets/events
    output: /assets/events
    categories: [image]

# ===========================================================
# صفحه اول
# ===========================================================
content:
  - name: home
    label: "صفحه اول"
    type: file
    path: _data/home.yml
    fields:
      - name: hero_lead
        label: "متن زیر عنوان اصلی (خالی بذار تا کامل حذف بشه)"
        type: text

      - name: hero_photos
        label: "اسلایدشو هدر"
        type: object
        list: true
        fields:
          - name: file
            label: "عکس (اندازه استاندارد: حداقل 1600×900 پیکسل، افقی)"
            type: image
            media: gallery
            required: true

      - name: gallery_album
        label: "آلبوم گالری صفحه اول (خالی بذار تا خودکار و چرخشی از همه آلبوم‌ها انتخاب بشه)"
        type: reference
        options:
          collection: events
          value: "{path}"
          label: "{title}"

      - name: partner_list
        label: "شرکای ما"
        type: object
        list: true
        fields:
          - name: name
            label: "نام شرکت"
            type: string
            required: true

          - name: logo
            label: "لوگو (اندازه استاندارد: حداکثر ۴۰۰×۱۶۰ پیکسل، پس‌زمینه شفاف PNG بهتره)"
            type: image
            media: partners

          - name: link
            label: "لینک سایت شرکت (اختیاری)"
            type: string

          - name: featured
            label: "حامی اصلی (لوگو بزرگ‌تر از بقیه نمایش داده می‌شه)"
            type: boolean

  # ===========================================================
  # تسک‌های ایندکس (داشبورد سئو)
  # ===========================================================
  - name: index_tasks
    label: "تسک‌های ایندکس (داشبورد سئو)"
    type: file
    path: _data/index_task_status.yml
    fields:
      - name: in_progress
        label: "صفحاتی که الان داری روی رفعشون کار می‌کنی (بعد از اضافه کردن، توی داشبورد وضعیتش «در حال رفع» نشون داده می‌شه؛ وقتی گوگل ایندکسش کرد، «حل‌شده» نشون داده می‌شه تا خودت از این لیست پاکش کنی)"
        type: object
        list: true
        fields:
          - name: url
            label: "آدرس صفحه (دقیقاً مثل چیزی که توی جدول داشبورد سئو نشون داده می‌شه، مثلاً /وبلاگ/قانون-10-درصد.html)"
            type: string
            required: true

          - name: note
            label: "یادداشت (اختیاری، مثلاً چه کاری داری انجام می‌دی)"
            type: text

  # ===========================================================
  # کلاس‌ها
  # ===========================================================
  - name: classes
    label: "کلاس‌ها"
    type: collection
    path: _classes
    filename: "{primary}.md"
    view:
      primary: title
      sort: order
      order: asc
    fields:
      - name: title
        label: "عنوان کلاس"
        type: string
        required: true

      - name: slug
        label: "آدرس صفحه (اختیاری — به فارسی و با خط تیره بین کلمات بنویس، مثلاً: کلاس-دویدن-مبتدی. اگه خالی بذاری، آدرس از روی اسم فایل ساخته می‌شه)"
        type: string

      - name: level_tag
        label: "برچسب سطح (انگلیسی کوتاه، مثل BEGINNER)"
        type: string
        required: true

      - name: order
        label: "ترتیب نمایش (عدد کوچیک‌تر = بالاتر)"
        type: number
        required: true

      - name: description
        label: "توضیح کوتاه (روی کارت نشون داده می‌شه)"
        type: text
        required: true


      - name: coach
        label: "نام مربی (دقیقاً همون‌طور که در بخش «مربیان» ثبت کردی بنویس)"
        type: string

      - name: currency
        label: "واحد نمایش قیمت در سایت"
        type: select
        options:
          values:
            - name: EUR
              label: "یورو"
            - name: TOMAN
              label: "تومان"


      - name: price
        label: "قیمت ماهانه (یورو)"
        type: number
        required: true

      - name: price_toman
        label: "قیمت ماهانه (تومان — با کاما بنویس، مثلاً 2,500,000)"
        type: string

      - name: body
        label: "توضیحات کامل (این متن توی صفحه جزئیات کلاس نشون داده می‌شه)"
        type: rich-text

  # ===========================================================
  # وبلاگ
  # ===========================================================
  - name: posts
    label: "وبلاگ › مقالات"
    type: collection
    path: _posts
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      primary: title
      sort: date
      order: desc
    fields:
      - name: title
        label: "عنوان"
        type: string
        required: true

      - name: focus_keyword
        label: "کلمه کلیدی اصلی (Focus Keyword) — همون عبارتی که انتظار داری خواننده توی گوگل سرچ کنه و این مقاله رو پیدا کنه. موقع نوشتن مقاله یادت باشه این عبارت توی چند جمله اول و حداقل یکی دو تا از زیرعنوان‌ها بیاد."
        type: string

      - name: slug
        label: "آدرس صفحه (اختیاری — به فارسی و با خط تیره بین کلمات بنویس، ترجیحاً کوتاه و نزدیک به کلمه کلیدی اصلی، مثلاً: راهنمای-شروع-دویدن. اگه خالی بذاری، آدرس از روی اسم فایل ساخته می‌شه)"
        type: string

      - name: description
        label: "توضیح کوتاه (زیر عنوان مقاله توی لیست مقالات نمایش داده می‌شه، حدود ۱۵۰ کاراکتر — اگه توضیح متای جداگانه ننویسی، همین توی گوگل هم نشون داده می‌شه)"
        type: text
        required: true

      - name: meta_title
        label: "عنوان متا برای گوگل (اختیاری — بین ۵۰ تا ۶۰ کاراکتر، کلمه کلیدی اصلی نزدیک ابتدا باشه. اگه خالی بذاری، همون «عنوان» بالا به‌علاوه «| ایران رانرز» استفاده می‌شه)"
        type: string

      - name: meta_description
        label: "توضیح متا برای گوگل (اختیاری — بین ۱۲۰ تا ۱۶۰ کاراکتر، جذاب و شامل کلمه کلیدی اصلی. اگه خالی بذاری، همون «توضیح کوتاه» بالا استفاده می‌شه)"
        type: text

      - name: category
        label: "دسته‌بندی"
        type: select
        options:
          values:
            - "علم دویدن"
            - "تغذیه"
            - "پیشگیری از آسیب"
            - "برنامه تمرینی"
            - "تجهیزات"
            - "سلامت"
        required: true

      - name: icon
        label: "آیکون تصویر مقاله (اگه عکس واقعی نذاری، از این آیکون استفاده می‌شه)"
        type: select
        options:
          values:
            - beginner
            - nutrition
            - knee
            - chart
            - marathon
            - shoe
            - recovery
            - air
        required: true

      - name: image
        label: "عکس مقاله (اختیاری — اگه نذاری، آیکون بالا نمایش داده می‌شه)"
        type: image
        media: blog

      - name: image_alt
        label: "توضیح کوتاه عکس برای نابینایان و گوگل (Alt Text) — توصیف واقعی عکس باشه، نه فقط اسم فایل. اگه خالی بذاری، از «عنوان» مقاله استفاده می‌شه"
        type: string

      - name: image_webp
        label: "نسخه WebP عکس مقاله (اختیاری، پیشرفته — برای سرعت بیشتر سایت. اگه نمی‌دونی چیه، خالی بذار)"
        type: image
        media: blog

      - name: read_time
        label: "زمان مطالعه (مثلاً 6 MIN READ)"
        type: string

      - name: date
        label: "تاریخ انتشار"
        type: date
        required: true

      - name: lead
        label: "پاراگراف مقدمه (زیر تیتر اصلی)"
        type: text
        required: true

      - name: cta_title
        label: "عنوان دعوت به اقدام (پایین مقاله)"
        type: string

      - name: cta_text
        label: "متن دعوت به اقدام"
        type: text

      - name: body
        label: "متن مقاله (از ## برای زیرعنوان‌های اصلی و ### برای زیرعنوان‌های فرعی استفاده کن. زیرعنوان‌های ## رو طوری بنویس که شبیه چیزی باشه که کاربر توی گوگل سرچ می‌کنه. حداقل ۲-۳ لینک به مقالات/صفحات دیگه سایت و در صورت نیاز یه لینک به منبع معتبر خارجی اضافه کن)"
        type: rich-text

  # ===========================================================
  # گالری
  # ===========================================================
  - name: events
    label: "گالری › رویدادها و عکس‌ها"
    type: collection
    path: _events
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      primary: title
      sort: date
      order: desc
    fields:
      - name: title
        label: "نام رویداد"
        type: string
        required: true

      - name: slug
        label: "آدرس صفحه (اختیاری — به فارسی و با خط تیره بین کلمات بنویس، مثلاً: مسابقه-پاییز. اگه خالی بذاری، آدرس از روی اسم فایل ساخته می‌شه)"
        type: string

      - name: date
        label: "تاریخ رویداد"
        type: date
        required: true

      - name: description
        label: "توضیح کوتاه (اختیاری)"
        type: text

      - name: photos
        label: "عکس‌های این رویداد"
        type: image
        media: events
        list: true
        required: true

  # ===========================================================
  # مربیان
  # ===========================================================
  - name: coaches
    label: "مربیان"
    type: file
    path: _data/coaches.yml
    list: true
    fields:
      - name: name
        label: "نام و نام‌خانوادگی"
        type: string
        required: true

      - name: role
        label: "سمت (مثلاً سرمربی)"
        type: string

      - name: photo
        label: "عکس مربی (اندازه استاندارد: حداقل 800×1000 پیکسل، عمودی)"
        type: image
        media: coaches

      - name: bio
        label: "بیوگرافی"
        type: text
        required: true

      - name: credentials
        label: "مدارک و سوابق (هر خط یک مورد)"
        type: string
        list: true

      - name: pr_5k
        label: "رکورد ۵ کیلومتر (اختیاری)"
        type: string

      - name: pr_half
        label: "رکورد نیم‌ماراتن (اختیاری)"
        type: string


      - name: telegram
        label: "آیدی تلگرام (بدون @، فقط مثلاً mojtaba_coach)"
        type: string

      - name: instagram
        label: "آیدی اینستاگرام (بدون @، اختیاری)"
        type: string

      - name: strava
        label: "لینک پروفایل استراوا (اختیاری)"
        type: string

  # ===========================================================
  # محاسبه‌گر پیس
  # ===========================================================
  - name: pace_calculator
    label: "محاسبه‌گر پیس"
    type: file
    path: _data/pace_calculator.yml
    fields:
      - name: hero_lead
        label: "متن زیر عنوان اصلی (بالای صفحه)"
        type: text
        required: true

      - name: convert_heading
        label: "عنوان تب «تبدیل پیس»"
        type: string
        required: true

      - name: convert_description
        label: "توضیح تب «تبدیل پیس»"
        type: text
        required: true

      - name: predict_heading
        label: "عنوان تب «پیش‌بینی مسابقه»"
        type: string
        required: true

      - name: predict_description
        label: "توضیح تب «پیش‌بینی مسابقه»"
        type: text
        required: true

  # ===========================================================
  # درباره ما
  # ===========================================================
  - name: about
    label: "درباره ما"
    type: file
    path: _data/about.yml
    fields:
      - name: body
        label: "متن معرفی تیم و برند"
        type: text

      - name: team_members
        label: "اعضای تیم"
        type: object
        list: true
        fields:
          - name: name
            label: "نام"
            type: string

          - name: role
            label: "سمت"
            type: string

          - name: photo
            label: "عکس"
            type: image
            media: coaches

      - name: contact_info
        label: "راه‌های تماس"
        type: object
        fields:
          - name: location
            label: "موقعیت مکانی"
            type: string
            required: true

          - name: instagram
            label: "آیدی اینستاگرام"
            type: string
